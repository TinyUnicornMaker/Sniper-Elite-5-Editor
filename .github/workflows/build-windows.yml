name: Build Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller se5editor.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          Compress-Archive -Path SniperElite5Editor -DestinationPath SniperElite5Editor-${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperElite5Editor-${{ github.ref_name }}
          path: dist/SniperElite5Editor-${{ github.ref_name }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SniperElite5Editor-${{ github.ref_name }}.zip
          draft: true
          generate_release_notes: true
