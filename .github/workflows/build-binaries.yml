name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller se5editor.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          Compress-Archive -Path SniperElite5Editor -DestinationPath SniperElite5Editor-${{ github.ref_name }}-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperElite5Editor-${{ github.ref_name }}-windows
          path: dist/SniperElite5Editor-${{ github.ref_name }}-windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SniperElite5Editor-${{ github.ref_name }}-windows.zip
          draft: true
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxfixes3 \
            libxrandr2 libxrender1 libasound2 libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller se5editor.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          zip -r SniperElite5Editor-${{ github.ref_name }}-linux.zip SniperElite5Editor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperElite5Editor-${{ github.ref_name }}-linux
          path: dist/SniperElite5Editor-${{ github.ref_name }}-linux.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SniperElite5Editor-${{ github.ref_name }}-linux.zip
          draft: true
          generate_release_notes: true
