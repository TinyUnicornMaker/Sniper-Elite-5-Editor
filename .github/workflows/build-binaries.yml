name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v1.2.0) — leave empty to use git short SHA'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Build matrix: one job per OS, uploaded as artifacts + release assets
  # ─────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_ext: zip
          - os: ubuntu-22.04
            platform: linux
            artifact_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-$(echo $GITHUB_SHA | cut -c1-8)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxfixes3 \
            libxrandr2 libxrender1 libasound2 libpulse0 \
            libglib2.0-0 libfreetype6 libharfbuzz0b

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller se5editor.spec --noconfirm

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path SniperElite5Editor -DestinationPath SniperElite5Editor-${{ steps.version.outputs.version }}-windows.zip

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar czf SniperElite5Editor-${{ steps.version.outputs.version }}-linux.tar.gz SniperElite5Editor

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperElite5Editor-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: dist/SniperElite5Editor-${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.artifact_ext }}
          retention-days: 30

      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Verify the binary starts and can import all modules
          # (can't fully test GUI in CI, but can check imports)
          cd dist/SniperElite5Editor
          ./SniperElite5Editor --help 2>&1 || true
          # Check that key files are present
          test -f SniperElite5Editor
          test -d _internal/assets/icons/hicolor
          test -f _internal/gui/vanilla_defaults.json
          echo "Smoke test passed"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SniperElite5Editor-${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.artifact_ext }}
          draft: true
          generate_release_notes: true
          name: Sniper Elite 5 Editor ${{ steps.version.outputs.version }}
